def basePath = '..'
/* All properties required for loading the Spark build script */
project.ext {
  spark_major = '4'
  // Spark 4 version as defined in BeamModulePlugin; requires Scala 2.13 and Java 17
  spark_version = spark4_version
  spark_scala_version = '2.13'
  archives_base_name = 'beam-runners-spark-4'
}

// Load the main build script which contains all build logic.
// spark_runner.gradle handles the per-version source-overrides Copy:
// shared base (runners/spark/src/) + previous majors + this module's ./src/ are
// merged into build/source-overrides/src using DuplicatesStrategy.INCLUDE so the
// 11 files under runners/spark/4/src/.../structuredstreaming/ override the
// shared-base versions.
apply from: "$basePath/spark_runner.gradle"

// Spark 4 always requires Java 17, so unconditionally add the --add-opens flags
// required by Kryo and other libraries that use reflection on JDK internals.
tasks.withType(Test).configureEach {
  jvmArgs "--add-opens=java.base/sun.nio.ch=ALL-UNNAMED",
          "--add-opens=java.base/java.nio=ALL-UNNAMED",
          "--add-opens=java.base/java.util=ALL-UNNAMED",
          "--add-opens=java.base/java.lang.invoke=ALL-UNNAMED"
}

tasks.validatesStructuredStreamingRunnerBatch {
  filter {
    // TODO(https://github.com/apache/beam/issues/36841): currently failing with INTERNAL_ERROR]
    //  Couldn't find method fromByteArray with arguments
    excludeTestsMatching 'org.apache.beam.sdk.transforms.CombineTest$BasicTests.testHotKeyCombining'
  }
}

tasks.register("validatesStructuredStreamingRunnerStreaming", Test) {
  applyStructuredStreamingValidatesRunnerSetup(it, ["--streaming": "true", "--streamingStopAfterIdleBatches": "5"], [
    // Side inputs
    'org.apache.beam.sdk.testing.UsesSideInputs',
    // Unbounded
    'org.apache.beam.sdk.testing.UsesTestStreamWithProcessingTime',
    // State and Timers
    'org.apache.beam.sdk.testing.UsesProcessingTimeTimers',
    'org.apache.beam.sdk.testing.UsesLoopingTimer',
    'org.apache.beam.sdk.testing.UsesMultimapState',
    // Windowing
    'org.apache.beam.sdk.testing.UsesCustomWindowMerging',
    // Ordering
    'org.apache.beam.sdk.testing.UsesRequiresTimeSortedInput',
    // SDF
    'org.apache.beam.sdk.testing.UsesBoundedSplittableParDo',
    // Exceeds Java heap space
    'org.apache.beam.sdk.testing.LargeKeys$Above100MB',
  ])

  filter {
    // TODO(https://github.com/apache/beam/issues/36841): merging windows
    excludeTestsMatching 'org.apache.beam.sdk.transforms.CombineTest$WindowingTests.testSessionsCombine'
    excludeTestsMatching 'org.apache.beam.sdk.transforms.GroupByKeyTest$WindowTests.testGroupByKeyMergingWindows'
    excludeTestsMatching 'org.apache.beam.sdk.transforms.RedistributeTest.testRedistributeAfterSessionsAndGroupByKey'
    excludeTestsMatching 'org.apache.beam.sdk.transforms.ReshuffleTest.testReshuffleAfterSessionsAndGroupByKey'
    excludeTestsMatching 'org.apache.beam.sdk.transforms.windowing.WindowingTest.testMergingWindowing'

    // TODO(https://github.com/apache/beam/issues/36841): side inputs, PAssert.thatSingleton and Combine.globally with defaults
    excludeTestsMatching 'org.apache.beam.sdk.io.CountingSourceTest.testBoundedSourceSplits'
    excludeTestsMatching 'org.apache.beam.sdk.io.CountingSourceTest.testUnboundedSourceSplits'
    excludeTestsMatching 'org.apache.beam.sdk.testing.PAssertTest.testIsEqualTo'
    excludeTestsMatching 'org.apache.beam.sdk.testing.PAssertTest.testNotEqualTo'
    excludeTestsMatching 'org.apache.beam.sdk.testing.PAssertTest.testWindowedIsEqualTo'
    excludeTestsMatching 'org.apache.beam.sdk.testing.PAssertTest.testPAssertEqualsSingletonFalse'
    excludeTestsMatching 'org.apache.beam.sdk.testing.PAssertTest.testPAssertEqualsSingletonFalseDefaultReasonString'
    excludeTestsMatching 'org.apache.beam.sdk.testing.PAssertTest.testPAssertEqualsSingletonFailsForEmptyPCollection'
    excludeTestsMatching 'org.apache.beam.sdk.testing.PAssertTest.testPAssertEqualsSingletonFailsForNonSingletonPCollection'

    // TODO(https://github.com/apache/beam/issues/41199): hot key fanout computes a wrong result
    excludeTestsMatching 'org.apache.beam.sdk.transforms.CombineTest$BasicTests.testHotKeyCombining'
    excludeTestsMatching 'org.apache.beam.sdk.transforms.CombineTest$BasicTests.testHotKeyCombiningWithAccumulationMode'

    // TODO(https://github.com/apache/beam/issues/40949): stateful ParDo with additional outputs
    excludeTestsMatching 'org.apache.beam.sdk.transforms.ParDoTest$StateTests.testValueStateTaggedOutput'

    // TODO(https://github.com/apache/beam/issues/36841): PeriodicImpulse uses a splittable DoFn
    excludeTestsMatching 'org.apache.beam.sdk.transforms.PerKeyOrderingTest.testMultipleStatefulOrderingWithShuffle'
    excludeTestsMatching 'org.apache.beam.sdk.transforms.PerKeyOrderingTest.testMultipleStatefulOrderingWithoutShuffle'

    // TODO(https://github.com/apache/beam/issues/32021)
    excludeTestsMatching 'org.apache.beam.sdk.metrics.MetricsTest$AttemptedMetricTests.testBoundedSourceMetricsInSplit'
  }
}

tasks.validatesRunner.dependsOn(validatesStructuredStreamingRunnerBatch)

// Exclude legacy DStream-based streaming tests (under runners/spark/translation/streaming)
// from the shared-base copy: the Spark 4 module does not include legacy DStream support.
// Streaming test utilities also depend on kafka.server.KafkaServerStartable which was
// removed in Kafka 2.8.0 (the first Kafka version with a _2.13 artifact).
// Note: structured streaming tests (**/structuredstreaming/translation/streaming/**) are
// intentionally NOT excluded.
tasks.named("copyTestSourceOverrides") {
  exclude "**/runners/spark/translation/streaming/**"
}

// Spark 4 uses org.lz4:lz4-java instead of at.yawk.lz4:lz4-java
// Explicitly prefer at.yawk.lz4 candidates to resolve capability conflict
configurations.all {
  resolveCapabilitiesConflict(it, 'org.lz4:lz4-java', 'at.yawk.lz4')
}
