[testenv:py311-onnx-{119,latest}]
# Keep in line with the onnx extra in setup.py. tensorflow is pinned to 2.21 in
# both environments because tensorflow<2.20 cannot be installed alongside the
# gcp extra (protobuf<6 vs protobuf>=6.33.5).
deps =
  # Lower bound of the supported range.
  119: onnxruntime>=1.19.0,<1.20
  119: onnx>=1.16.0,<1.17
  119: skl2onnx>=1.17.0,<1.18
  119: torch>=2.3.0,<2.4.0
  latest: onnxruntime>=1.31.0,<2
  latest: onnx>=1.23.0,<2
  latest: skl2onnx>=1.20.0,<2
  latest: torch>=2.11.0,<2.12.0
  tf2onnx>=1.17.0,<1.18
  tensorflow>=2.21.0,<2.22
  # torch>=2.9 exports to ONNX through torch.export, which requires onnxscript.
  onnxscript>=0.5.0,<1
extras = test,gcp
commands =
  # Log onnx version for debugging
  /bin/sh -c "pip freeze | grep -E onnx"
  # Run all ONNX unit tests
  # Allow exit code 5 (no tests run) so that we can run this command safely on arbitrary subdirectories.
  /bin/sh -c 'pytest -o junit_suite_name={envname} --junitxml=pytest_{envname}.xml -n 6 -m uses_onnx {posargs}; ret=$?; [ $ret = 5 ] && exit 0 || exit $ret'

[testenv:py311-tensorflow-{216,221}]
# Keep in line with the tensorflow extra in setup.py.
# tensorflow<2.20 requires protobuf<6, which cannot be installed alongside the
# gcp extra (protobuf>=6.33.5 via google-cloud-bigtable), so the lower-bound
# environment only installs the test extra.
# tensorflow-hub is needed by the TensorFlow inference tests; it imports
# pkg_resources, which was removed in setuptools 82.
deps =
  216: tensorflow>=2.16.0,<2.17
  216: tf-keras>=2.16.0,<2.17
  216: protobuf>=4.25.2,<5
  221: tensorflow>=2.21.0,<2.22
  221: tf-keras>=2.21.0,<2.22
  tensorflow-hub>=0.16.1,<0.17
  setuptools<82
extras =
  216: test
  221: test,gcp
# Apply the deps above as constraints when installing Beam's own dependencies,
# so that they cannot upgrade e.g. protobuf past tensorflow 2.16's protobuf<5
# cap.
constrain_package_deps = true
commands =
  # Log tensorflow version for debugging
  /bin/sh -c "pip freeze | grep -E tensorflow"
  # Run all Tensorflow unit tests
  # Allow exit code 5 (no tests run) so that we can run this command safely on arbitrary subdirectories.
  /bin/sh -c 'pytest -o junit_suite_name={envname} --junitxml=pytest_{envname}.xml -n 6 -m uses_tf {posargs}; ret=$?; [ $ret = 5 ] && exit 0 || exit $ret'

