/**
 * Unit tests for Python 3.14
 */

plugins { id 'org.apache.beam.module' }
applyPythonNature()

// Required to setup a Python 3 virtualenv and task names.
pythonVersion = '3.14'

project.tasks.register("postCommitPyDep") {}

apply from: "../common.gradle"

def posargs = project.findProperty("posargs") ?: ""

// Latest supported pytorch. torch>=2.10 is required for Python 3.14.
// Keep in sync with [testenv:py314-pytorch-latest] in tox.ini.
toxTask "testPy314pytorch-latest", "py314-pytorch-latest", "${posargs}"
test.dependsOn "testPy314pytorch-latest"
postCommitPyDep.dependsOn "testPy314pytorch-latest"

