fixtures:
  - name: PUBSUB_VARS
    type: "apache_beam.yaml.integration_tests.temp_pubsub_subscriptions"
    config:
      project_id: "apache-beam-testing"
  - name: FAKE_SPLUNK_SERVER
    type: "apache_beam.yaml.test_utils.splunk_test_utils.temp_fake_splunk_server"
    config:
      expected_records:
        - { time: 1700000000, host: "test-host", source: "apache-beam-11a", sourcetype: "test-type", index: "test-index", event: "Event for label 11a with rank 1" }
        - { time: 1700000000, host: "test-host", source: "apache-beam-37a", sourcetype: "test-type", index: "test-index", event: "Event for label 37a with rank 2" }
        - { time: 1700000000, host: "test-host", source: "apache-beam-389a", sourcetype: "test-type", index: "test-index", event: "Event for label 389a with rank 3" }
        - { time: 1700000000, host: "test-host", source: "apache-beam-3821b", sourcetype: "test-type", index: "test-index", event: "Event for label 3821b with rank 4" }

pipelines:
  # Pipeline 1: Publish test messages (valid and invalid) to Pub/Sub input topic
  - pipeline:
      type: chain
      transforms:
        - type: Create
          config:
            elements:
              - {label: "11a", rank: 1}
              - {label: "37a", rank: 2}
              - {label: "389a", rank: 3}
              - {label: "3821b", rank: 4}
              - {label: "broken", rank: -1}
        - type: WriteToPubSub
          config:
            topic: "{PUBSUB_VARS[INPUT_TOPIC]}"
            format: JSON

  # Pipeline 2: Read from Pub/Sub subscription, transform and write to Splunk HEC,
  # and route failed records to Pub/Sub deadletter topic
  - pipeline:
      type: composite
      transforms:
        - type: ReadFromPubSub
          name: ReadMessages
          config:
            subscription: "{PUBSUB_VARS[INPUT_SUBSCRIPTION]}"
            format: JSON
            schema:
              type: object
              properties:
                label: {type: string}
                rank: {type: integer}
              required:
                - label
                - rank

        - type: MapToFields
          name: ConvertToSplunkEvents
          input: ReadMessages
          config:
            language: python
            fields:
              time: 1700000000
              host: "'test-host'"
              source:
                expression: "'apache-beam-' + label"
                output_type: string
              sourcetype: "'test-type'"
              index: "'test-index'"
              event:
                callable: |
                  from typing import Optional
                  def format_event(row) -> Optional[str]:
                    if row.rank < 0:
                      return None
                    return str("Event for label " + row.label + " with rank " + str(row.rank))

        - type: WriteToSplunk
          name: WriteToSplunk
          input: ConvertToSplunkEvents
          config:
            url: "{FAKE_SPLUNK_SERVER.url}"
            token: "{FAKE_SPLUNK_SERVER.token}"
            batch_count: 2
            parallelism: 1
            disable_certificate_validation: false
            enable_batch_logs: true
            enable_gzip_http_compression: true
            error_handling:
              output: write_errors

        - type: MapToFields
          name: FormatWriteErrors
          input: WriteToSplunk.write_errors
          config:
            language: python
            fields:
              failed_source:
                expression: "failed_row.source"
                output_type: string
              error_message:
                expression: "statusMessage"
                output_type: string

        - type: WriteToPubSub
          name: WriteFailedRecords
          input: FormatWriteErrors
          config:
            topic: "{PUBSUB_VARS[DEADLETTER_TOPIC]}"
            format: JSON

  # Pipeline 3: Read from Pub/Sub deadletter subscription and verify failed records
  - pipeline:
      type: chain
      transforms:
        - type: ReadFromPubSub
          config:
            subscription: "{PUBSUB_VARS[DEADLETTER_SUBSCRIPTION]}"
            format: JSON
            schema:
              type: object
              properties:
                failed_source: {type: string}
                error_message: {type: string}
              required:
                - failed_source
                - error_message
        - type: AssertEqual
          config:
            elements:
              - {failed_source: "apache-beam-broken", error_message: "Event is required."}
