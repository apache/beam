fixtures:
  - name: MONGO_VARS
    type: "apache_beam.yaml.integration_tests.temp_mongodb_table"
  - name: BQ_TABLE
    type: "apache_beam.yaml.integration_tests.temp_bigquery_table"
    config:
      project: "apache-beam-testing"
  - name: TEMP_DIR
    type: "apache_beam.yaml.integration_tests.gcs_temp_dir"
    config:
      bucket: "gs://temp-storage-for-end-to-end-tests/temp-it"

pipelines:
  # Pipeline 1: Write records to MongoDB
  - pipeline:
      type: chain
      transforms:
        - type: Create
          config:
            elements:
              - {id: 1, name: "Alice", score: 95.5}
              - {id: 2, name: "Bob", score: 88.0}
              - {id: 3, name: "Charlie", score: 92.3}
        - type: WriteToMongoDB
          config:
            uri: "{MONGO_VARS[URI]}"
            database: "{MONGO_VARS[DATABASE]}"
            collection: "{MONGO_VARS[COLLECTION]}"

  # Pipeline 2: Read from MongoDB and write to BigQuery
  - pipeline:
      type: chain
      transforms:
        - type: ReadFromMongoDB
          config:
            uri: "{MONGO_VARS[URI]}"
            database: "{MONGO_VARS[DATABASE]}"
            collection: "{MONGO_VARS[COLLECTION]}"
            schema: |
              {
                "type": "object",
                "properties": {
                  "id": {"type": "integer"},
                  "name": {"type": "string"},
                  "score": {"type": "number"}
                },
                "required": ["id", "name", "score"]
              }
        - type: WriteToBigQuery
          config:
            table: "{BQ_TABLE}"
    options:
      project: "apache-beam-testing"
      temp_location: "{TEMP_DIR}"

  # Pipeline 3: Read from BigQuery and verify records
  - pipeline:
      type: chain
      transforms:
        - type: ReadFromBigQuery
          config:
            table: "{BQ_TABLE}"
        - type: AssertEqual
          config:
            elements:
              - {id: 1, name: "Alice", score: 95.5}
              - {id: 2, name: "Bob", score: 88.0}
              - {id: 3, name: "Charlie", score: 92.3}
    options:
      project: "apache-beam-testing"
      temp_location: "{TEMP_DIR}"
