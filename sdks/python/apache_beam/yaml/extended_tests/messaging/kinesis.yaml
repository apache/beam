fixtures:
  - name: kinesis_vars
    type: "apache_beam.yaml.integration_tests.temp_kinesis_localstack"

pipelines:
  # Kinesis write pipeline
  - pipeline:
      type: chain
      transforms:
        - type: Create
          config:
            elements:
              - {value: 123}
              - {value: 456}
              - {value: 789}
        - type: MapToFields
          config:
            language: python
            fields:
              data:
                callable: |
                  lambda row: str(row.value).encode('utf-8')
                output_type: bytes
        - type: WriteToKinesis
          config:
            stream_name: '{kinesis_vars[STREAM_NAME]}'
            aws_access_key: '{kinesis_vars[AWS_ACCESS_KEY]}'
            aws_secret_key: '{kinesis_vars[AWS_SECRET_KEY]}'
            region: '{kinesis_vars[REGION]}'
            service_endpoint: '{kinesis_vars[SERVICE_ENDPOINT]}'
            verify_certificate: false
            partition_key: "1"

  # Kinesis read pipeline. Separate from write so records are flushed first.
  - pipeline:
      type: chain
      transforms:
        - type: ReadFromKinesis
          config:
            stream_name: '{kinesis_vars[STREAM_NAME]}'
            aws_access_key: '{kinesis_vars[AWS_ACCESS_KEY]}'
            aws_secret_key: '{kinesis_vars[AWS_SECRET_KEY]}'
            region: '{kinesis_vars[REGION]}'
            service_endpoint: '{kinesis_vars[SERVICE_ENDPOINT]}'
            verify_certificate: false
            max_num_records: 3
            max_read_time: 60000
            initial_position_in_stream: TRIM_HORIZON
            request_records_limit: 1000
        - type: MapToFields
          config:
            language: python
            fields:
              value:
                callable: |
                  lambda row: row.data.decode('utf-8')
                output_type: string
        - type: AssertEqual
          config:
            elements:
              - {value: "123"}
              - {value: "456"}
              - {value: "789"}

    options:
      streaming: true
