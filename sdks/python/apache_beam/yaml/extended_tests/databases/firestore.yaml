fixtures:
  - name: firestore_vars
    type: "apache_beam.yaml.integration_tests.temp_firestore_collection"
    config:
      project: "apache-beam-testing"
      database: "firestoredb"

pipelines:
  - pipeline:
      type: composite
      transforms:
        - type: Create
          name: CreateData
          config:
            elements:
              - {document_id: "a", name: "Alice"}
              - {document_id: "b", name: "Bob"}
        - type: WriteToFirestore
          name: WriteData
          input: CreateData
          config:
            project: "apache-beam-testing"
            database: "firestoredb"
            collection: '{firestore_vars[COLLECTION]}'
            error_handling:
              output: write_errors
        - type: AssertEqual
          input: WriteData.write_errors
          config:
            elements: []
    options:
      project: "apache-beam-testing"
      firestore_db: "firestoredb"

  - pipeline:
      type: composite
      transforms:
        - type: ReadFromFirestore
          name: ReadData
          config:
            project: "apache-beam-testing"
            database: "firestoredb"
            collection: '{firestore_vars[COLLECTION]}'
            schema: |
              {
                "type": "object",
                "properties": {
                  "document_id": {"type": "string"},
                  "name": {"type": "string"}
                },
                "required": ["document_id", "name"]
              }
            error_handling:
              output: read_errors
        - type: AssertEqual
          input: ReadData
          config:
            elements:
              - {document_id: "a", name: "Alice"}
              - {document_id: "b", name: "Bob"}
        - type: AssertEqual
          input: ReadData.read_errors
          config:
            elements: []
    options:
      project: "apache-beam-testing"
      firestore_db: "firestoredb"
