fixtures:
  - name: BQ_TABLE
    type: "apache_beam.yaml.integration_tests.temp_bigquery_table"
    config:
      project: "apache-beam-testing"
  - name: TEMP_DIR
    # Need distributed filesystem to be able to read and write from a container.
    type: "apache_beam.yaml.integration_tests.gcs_temp_dir"
    config:
      bucket: "gs://temp-storage-for-end-to-end-tests/temp-it"

pipelines:
  # CDC UPSERT via Storage Write API (same shape as xlang_bigqueryio_it_test).
  - pipeline:
      type: chain
      transforms:
        - type: Create
          config:
            elements:
              - record: {label: "11a", rank: 0}
                row_mutation_info:
                  mutation_type: UPSERT
                  change_sequence_number: "AAA/0"
              - record: {label: "37a", rank: 1}
                row_mutation_info:
                  mutation_type: UPSERT
                  change_sequence_number: "AAA/1"
              - record: {label: "389a", rank: 2}
                row_mutation_info:
                  mutation_type: UPSERT
                  change_sequence_number: "AAA/2"
        - type: WriteToBigQueryCDC
          config:
            table: "{BQ_TABLE}"
            primary_key: [label]
            create_disposition: CREATE_IF_NEEDED
            use_at_least_once_semantics: true
    options:
      project: "apache-beam-testing"
      temp_location: "{TEMP_DIR}"

  - pipeline:
      type: chain
      transforms:
        - type: ReadFromBigQuery
          config:
            table: "{BQ_TABLE}"
        - type: AssertEqual
          config:
            elements:
              - {label: "11a", rank: 0}
              - {label: "37a", rank: 1}
              - {label: "389a", rank: 2}
    options:
      project: "apache-beam-testing"
      temp_location: "{TEMP_DIR}"
