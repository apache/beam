fixtures:
  - name: TEMP_DIR
    type: "tempfile.TemporaryDirectory"


pipelines:
  # Pipeline 1: files with two columns
  - pipeline:
      type: chain
      transforms:
        - type: Create
          config:
            elements:
              - {label: "11a", rank: 0}
              - {label: "37a", rank: 1}
        - type: WriteToParquet
          config:
            path: "{TEMP_DIR}/data/narrow"
            file_name_suffix: ".parquet"
            num_shards: 1

  # Pipeline 2: files with an extra column
  - pipeline:
      type: chain
      transforms:
        - type: Create
          config:
            elements:
              - {label: "389a", rank: 2, bool: false}
              - {label: "3821b", rank: 3, bool: true}
        - type: WriteToParquet
          config:
            path: "{TEMP_DIR}/data/wide"
            file_name_suffix: ".parquet"
            num_shards: 1

  # Pipeline 3: a dry run against a table that does not exist yet; the report is written as JSON
  # from the dry_run_report output, the way a user keeps it
  - pipeline:
      transforms:
        - type: ReadMatchFiles
          name: Match
          config:
            file_pattern: "{TEMP_DIR}/data/*.parquet"
        - type: MapToFields
          name: Paths
          input: Match
          config:
            language: python
            fields:
              path:
                callable: "lambda row: row.path"
                output_type: string
        - type: IcebergAddFiles
          name: DryRun
          input: Paths
          config:
            table: "default.table"
            catalog_properties:
              type: "hadoop"
              warehouse: "{TEMP_DIR}/dir"
            schema_evolution_options: [ALLOW_FIELD_ADDITION]
            dry_run: true
        - type: WriteToJson
          name: WriteReport
          input: DryRun.dry_run_report
          config:
            path: "{TEMP_DIR}/report.json"
        # the full report, as a real run against this input would decide it: one row per
        # distinct schema (canonical JSON, allowed), the create row (the table a real run would
        # create, from the union, every column optional) and the summary row
        - type: AssertEqual
          name: AssertReport
          input: DryRun.dry_run_report
          config:
            elements:
              - schema_key: "s48334d"
                schema: '{{"type":"struct","schema-id":0,"fields":[{{"id":1,"name":"label","required":true,"type":"string"}},{{"id":2,"name":"rank","required":true,"type":"long"}}]}}'
                num_files: 1
                changes: []
                allowed: true
                reason: ""
                would_create_table: true
                summary: false
              - schema_key: "s27e62d"
                schema: '{{"type":"struct","schema-id":0,"fields":[{{"id":1,"name":"bool","required":true,"type":"boolean"}},{{"id":2,"name":"label","required":true,"type":"string"}},{{"id":3,"name":"rank","required":true,"type":"long"}}]}}'
                num_files: 1
                changes: []
                allowed: true
                reason: ""
                would_create_table: true
                summary: false
              - schema_key: "create"
                schema: '{{"type":"struct","schema-id":0,"fields":[{{"id":1,"name":"bool","required":false,"type":"boolean"}},{{"id":2,"name":"label","required":false,"type":"string"}},{{"id":3,"name":"rank","required":false,"type":"long"}}]}}'
                num_files: 2
                changes: ["create optional bool boolean", "create optional label string", "create optional rank long"]
                allowed: true
                reason: ""
                would_create_table: true
                summary: false
              - schema_key: "summary"
                schema: ""
                num_files: 2
                changes: ["2 distinct schemas; 2 allowed covering 2 files; 0 incompatible covering 0 files; 0 files unreadable; 0 files unchecked (ORC or Avro)"]
                allowed: true
                reason: ""
                would_create_table: true
                summary: true

    providers:
      - type: python
        config: { }
        transforms:
          ReadMatchFiles: 'apache_beam.io.fileio.MatchFiles'

  # Pipeline 4: the report was written (arrays come back as strings through ReadFromJson, so
  # only the scalar columns are compared here; the full rows are asserted above)
  - pipeline:
      type: chain
      transforms:
        - type: ReadFromJson
          config:
            path: "{TEMP_DIR}/report.json*"
        - type: MapToFields
          config:
            fields:
              num_files: num_files
              allowed: allowed
              would_create_table: would_create_table
              summary: summary
        - type: AssertEqual
          config:
            elements:
              - {num_files: 1, allowed: true, would_create_table: true, summary: false}
              - {num_files: 1, allowed: true, would_create_table: true, summary: false}
              - {num_files: 2, allowed: true, would_create_table: true, summary: false}
              - {num_files: 2, allowed: true, would_create_table: true, summary: true}
