pipelines:
  - pipeline:
      type: chain
      transforms:
        - type: Create
          config:
            elements:
              - {tenant_id: "a", event_id: 1, value: "first"}
              - {tenant_id: "a", event_id: 1, value: "first"}
              - {tenant_id: "a", event_id: 2, value: "second"}
              - {tenant_id: "b", event_id: 1, value: "third"}
              - {tenant_id: "b", event_id: 1, value: "third"}
        - type: Deduplicate
          config:
            keys: [tenant_id, event_id]
            duration: 10m
        - type: AssertEqual
          config:
            elements:
              - {tenant_id: "a", event_id: 1, value: "first"}
              - {tenant_id: "a", event_id: 2, value: "second"}
              - {tenant_id: "b", event_id: 1, value: "third"}

  - pipeline:
      type: chain
      transforms:
        - type: Create
          config:
            elements:
              - {event_id: 1, value: "a"}
              - {event_id: 1, value: "a"}
              - {event_id: 2, value: "b"}
        - type: Deduplicate
          config:
            keys: [event_id]
            duration: 30s
            time_domain: event_time
        - type: AssertEqual
          config:
            elements:
              - {event_id: 1, value: "a"}
              - {event_id: 2, value: "b"}
