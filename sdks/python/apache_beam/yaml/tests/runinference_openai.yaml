pipelines:
  - pipeline:
      type: chain
      transforms:
        - type: Create
          config:
            elements:
              - text: "I love Apache Beam!"
              - text: "I hate this error."
        - type: RunInference
          config:
            model_handler:
              type: "OpenAIModelHandler"
              config:
                model_name: "gpt-5.4-mini"
                api_key: "fake-api-key"
                request_fn:
                  callable: |
                    def fake_inference(model_name, batch, client, inference_args):
                      return [
                        {
                          'label': 'POSITIVE' if 'love' in text else 'NEGATIVE',
                          'model': model_name
                        }
                        for text in batch
                      ]
                preprocess:
                  callable: 'lambda x: x.text'
        - type: MapToFields
          config:
            language: python
            fields:
              text: text
              sentiment:
                callable: 'lambda x: x.inference.inference["label"]'
        - type: AssertEqual
          config:
            elements:
              - text: "I love Apache Beam!"
                sentiment: "POSITIVE"
              - text: "I hate this error."
                sentiment: "NEGATIVE"

    options:
      yaml_experimental_features: ['ML']
