# One IcebergAddFiles registers files in several tables, naming each table from the file's
# own path. Note on '{{tbl}}': this harness runs str.format over the spec to fill
# '{TEMP_DIR}', so a literal brace has to be doubled here. A real YAML pipeline writes
# '{tbl}' once.

fixtures:
  - name: TEMP_DIR
    type: "tempfile.TemporaryDirectory"


pipelines:
  # Pipeline 1: one table's files, in a folder named after the table
  - pipeline:
      type: chain
      transforms:
        - type: Create
          config:
            elements:
              - {label: "11a", rank: 0}
              - {label: "37a", rank: 1}
        - type: WriteToParquet
          config:
            path: "{TEMP_DIR}/export/orders/data"
            file_name_suffix: ".parquet"
            num_shards: 1

  # Pipeline 2: a second table, same layout
  - pipeline:
      type: chain
      transforms:
        - type: Create
          config:
            elements:
              - {label: "389a", rank: 2}
        - type: WriteToParquet
          config:
            path: "{TEMP_DIR}/export/events/data"
            file_name_suffix: ".parquet"
            num_shards: 1

  # Pipeline 3: a file outside the pattern, so the error output has something in it
  - pipeline:
      type: chain
      transforms:
        - type: Create
          config:
            elements:
              - {label: "stray", rank: 9}
        - type: WriteToParquet
          config:
            path: "{TEMP_DIR}/misc/stray/data"
            file_name_suffix: ".parquet"
            num_shards: 1

  # Pipeline 4: register everything in one pass. path_pattern decides the table per file;
  # the file under misc/ matches nothing and is reported instead of registered.
  - pipeline:
      type: composite
      transforms:
        - type: ReadMatchFiles
          name: Match
          config:
            file_pattern: "{TEMP_DIR}/*/*/*.parquet"
        - type: MapToFields
          name: Paths
          input: Match
          config:
            language: python
            fields:
              path:
                callable: "lambda row: row.path"
                output_type: string
        - type: IcebergAddFiles
          name: AddFiles
          input: Paths
          config:
            table: "default.{{tbl}}"
            path_pattern: "{TEMP_DIR}/export/{{tbl}}/**"
            catalog_properties:
              type: "hadoop"
              warehouse: "{TEMP_DIR}/dir"
            schema_evolution_options: [ALLOW_FIELD_ADDITION]
            error_handling:
              output: error_output
        - type: WriteToJson
          name: WriteErrorsToJson
          input: AddFiles.error_output
          config:
            path: "{TEMP_DIR}/error.json"

    providers:
      - type: python
        config: { }
        transforms:
          ReadMatchFiles: 'apache_beam.io.fileio.MatchFiles'

  # Pipeline 5: the first table holds only its own rows
  - pipeline:
      type: chain
      transforms:
        - type: ReadFromIceberg
          config:
            table: "default.orders"
            catalog_properties:
              type: "hadoop"
              warehouse: "{TEMP_DIR}/dir"
        - type: AssertEqual
          config:
            elements:
              - {label: "11a", rank: 0}
              - {label: "37a", rank: 1}

  # Pipeline 6: and the second table only its own
  - pipeline:
      type: chain
      transforms:
        - type: ReadFromIceberg
          config:
            table: "default.events"
            catalog_properties:
              type: "hadoop"
              warehouse: "{TEMP_DIR}/dir"
        - type: AssertEqual
          config:
            elements:
              - {label: "389a", rank: 2}

  # Pipeline 7: the unroutable file is reported, with the table it could not be given
  - pipeline:
      type: chain
      transforms:
        - type: ReadFromJson
          config:
            path: "{TEMP_DIR}/error.json*"
        - type: AssertEqual
          config:
            elements:
              - file: "{TEMP_DIR}/misc/stray/data-00000-of-00001.parquet"
                error: "did not match path_pattern '{TEMP_DIR}/export/{{tbl}}/**'"
                table: ""
