# This is an example of a Beam YAML pipeline that reads from a MongoDB database
# and writes to BigQuery.  This matches the Dataflow Template located
# here - https://cloud.google.com/dataflow/docs/guides/templates/provided/mongodb-to-bigquery

pipeline:
  type: chain
  transforms:
    # Step 1: Reading data from MongoDB
    - type: ReadFromMongoDB
      name: ReadFromMongoDB
      config:
        uri: "mongodb://localhost:27017"
        database: "shipment"
        collection: "shipments"
        schema: |
          {
            "type": "object",
            "properties": {
              "shipment_id": {"type": "string"},
              "customer_id": {"type": "string"},
              "shipment_date": {"type": "string"},
              "shipment_cost": {"type": "number"},
              "customer_name": {"type": "string"},
              "customer_email": {"type": "string"}
            },
            "required": [
              "shipment_id",
              "customer_id",
              "shipment_date",
              "shipment_cost",
              "customer_name",
              "customer_email"
            ]
          }
    # Step 2: Write records out to BigQuery
    - type: WriteToBigQuery
      name: WriteShipments
      config:
        table: "apache-beam-testing.yaml_test.shipments"
        create_disposition: "CREATE_NEVER"
        write_disposition: "WRITE_APPEND"
        num_streams: 1

options:
  temp_location: "gs://apache-beam-testing/temp"

