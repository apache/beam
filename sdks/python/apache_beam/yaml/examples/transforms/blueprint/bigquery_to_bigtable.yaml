# This is an example of a Beam YAML pipeline that reads from BigQuery
# and writes to Cloud Bigtable.

pipeline:
  type: chain
  transforms:
    # Step 1: Reading data from BigQuery
    - type: ReadFromBigQuery
      name: ReadFromBigQuery
      config:
        table: "apache-beam-testing.shipment.shipments"
    # Step 2: Write records out to Cloud Bigtable
    - type: WriteToBigTable
      name: WriteToBigTable
      config:
        project: "apache-beam-testing"
        instance: "shipment-test"
        table: "shipments"

