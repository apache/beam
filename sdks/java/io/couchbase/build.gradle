plugins { id 'org.apache.beam.module' }
applyJavaNature( automaticModuleName: 'org.apache.beam.sdk.io.couchbase')

description = "Apache Beam :: SDKs :: Java :: IO :: Couchbase"
ext.summary = "IO to read and write on Couchbase."

dependencies {
  implementation project(path: ":sdks:java:core", configuration: "shadow")
  implementation library.java.couchbase_java_client
  // Same versions as java-client's transitive dependencies; used directly for Flux in WriteFn.
  implementation "io.projectreactor:reactor-core:3.6.9"
  implementation "org.reactivestreams:reactive-streams:1.0.4"
  implementation library.java.jackson_databind
  implementation library.java.vendored_guava_32_1_2_jre
  testImplementation project(path: ":sdks:java:core", configuration: "shadowTest")
  testImplementation library.java.junit
  testImplementation library.java.hamcrest
  testImplementation library.java.testcontainers_couchbase
  testRuntimeOnly library.java.slf4j_jdk14
  testRuntimeOnly project(path: ":runners:direct-java", configuration: "shadow")
}
