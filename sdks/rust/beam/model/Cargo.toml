[package]
name = "apache-beam-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Portability model definitions and gRPC bindings for Apache Beam in Rust"

[lib]
name = "model"
doctest = false

[dependencies]
prost = { workspace = true }
prost-types = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }

# No [lints] workspace opt-in: this crate is entirely tonic/prost generated code.

# These are used by the generated code `tonic::include_proto!` pulls in from OUT_DIR,
# which cargo-machete does not scan.
[package.metadata.cargo-machete]
ignored = ["prost", "prost-types", "tonic-prost"]

