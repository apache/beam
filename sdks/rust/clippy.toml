# `unwrap_used`, `expect_used` and `panic` target library, binary and example code.
# `lint.gradle` allows them on `--tests --benches`, and these flags exempt `#[cfg(test)]`.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
