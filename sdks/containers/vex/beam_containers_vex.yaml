# Canonical Vulnerability Exploitability eXchange (VEX) configuration for
# Apache Beam SDK container images.
#
# Use `python3 sdks/containers/vex/vex_manager.py generate` to generate:
#   - OpenVEX v0.2.0 statements (`sdks/containers/vex/openvex/*.openvex.json`)
#   - CSAF 2.0 VEX statements (`sdks/containers/vex/csaf/*.vex.json`) for
#     Google Artifact Registry (`gcloud artifacts vulnerabilities load-vex`)
#   - AutoVM / Lichene triage snippets (`sdks/containers/vex/lichene/beam_vex_rules.pi`)

schema_version: "1.0"
publisher:
  name: "Apache Beam Project"
  namespace: "https://beam.apache.org"
  role: "vendor"
  contact_details: "https://beam.apache.org/community/contact-us/"

image_families:
  beam_go_sdk:
    description: "Apache Beam Go SDK harness container image"
    repositories:
      - "docker.io/apache/beam_go_sdk"
      - "gcr.io/apache-beam-testing/updated_released_container_images/beam_go_sdk"
      - "gcr.io/cloud-dataflow/v1beta3/beam_go_sdk"
      - "us.gcr.io/cloud-dataflow/v1beta3/beam_go_sdk"
      - "us-central1-docker.pkg.dev/google.com:dataflow-containers/worker/v1beta3/beam_go_sdk"
    runtime_entrypoints:
      - "/opt/apache/beam/boot"
    inherited_rule_sets:
      - "debian_build_and_desktop_os_packages"
    statements:
      - id: "CVE-2019-9192"
        status: "not_affected"
        justification: "vulnerable_code_not_in_execute_path"
        packages: ["glibc"]
        impact_statement: >-
          CVE-2019-9192 is a disputed stack-consumption issue in the POSIX regex
          compiler regcomp() in GNU C Library when compiling untrusted regular
          expressions. The Apache Beam Go SDK boot binary (/opt/apache/beam/boot)
          uses Go's native RE2 regexp package and does not invoke glibc regcomp().
      - id: "CVE-2018-20796"
        status: "not_affected"
        justification: "vulnerable_code_not_in_execute_path"
        packages: ["glibc"]
        impact_statement: >-
          CVE-2018-20796 affects glibc POSIX regcomp() on crafted backreference
          expressions. The Beam Go SDK boot container executes Go binaries that
          use Go's standard library regexp package rather than glibc regcomp().
      - id: "CVE-2019-1010022"
        status: "not_affected"
        justification: "vulnerable_code_not_in_execute_path"
        packages: ["glibc"]
        impact_statement: >-
          Disputed upstream glibc issue in pthread stack guard sizing. The Beam Go
          SDK harness runs on the Go runtime scheduler (goroutines) and does not
          rely on glibc pthread guard-page allocation for untrusted native code.
      - id: "CVE-2019-1010023"
        status: "not_affected"
        justification: "vulnerable_code_not_in_execute_path"
        packages: ["glibc"]
        impact_statement: >-
          Disputed upstream glibc ldd utility issue when inspecting untrusted ELF
          binaries. The Beam Go SDK harness never invokes ldd at runtime.
      - id: "CVE-2019-1010024"
        status: "not_affected"
        justification: "vulnerable_code_not_in_execute_path"
        packages: ["glibc"]
        impact_statement: >-
          Disputed upstream glibc ASLR commentary. Not reachable as a runtime
          vulnerability in the Beam Go SDK container.
      - id: "CVE-2019-1010025"
        status: "not_affected"
        justification: "vulnerable_code_not_in_execute_path"
        packages: ["glibc"]
        impact_statement: >-
          Disputed upstream glibc ptmalloc heap address predictability report.
          The Beam Go SDK harness uses the Go runtime memory allocator.
      - ids:
          - "CVE-2026-39817"
          - "CVE-2026-39819"
          - "CVE-2026-42501"
          - "CVE-2026-56864"
          - "CVE-2026-56865"
          - "CVE-2026-94444"
          - "CVE-2026-94447"
        status: "not_affected"
        justification: "component_not_present"
        packages: ["toolchain"]
        impact_statement: >-
          These CVEs affect the build-time cmd/go toolchain when building or
          fetching untrusted Go modules. The Beam Go SDK runtime container does
          not ship or execute cmd/go; scanners report these solely from the Go
          compiler version embedded in /opt/apache/beam/boot build metadata.
      - ids:
          - "CVE-2026-116585"
          - "CVE-2026-116586"
          - "CVE-2026-116587"
        status: "not_affected"
        justification: "vulnerable_code_not_in_execute_path"
        packages: ["github.com/go-jose/go-jose/v4"]
        impact_statement: >-
          github.com/go-jose/go-jose/v4 is a transitive module dependency in
          sdks/go.mod and is not imported or called by the Beam Go SDK container
          entrypoint (/opt/apache/beam/boot).

  beam_python_sdk:
    description: "Apache Beam Python SDK harness container images (3.10 - 3.14)"
    repositories:
      - "docker.io/apache/beam_python3.10_sdk"
      - "docker.io/apache/beam_python3.11_sdk"
      - "docker.io/apache/beam_python3.12_sdk"
      - "docker.io/apache/beam_python3.13_sdk"
      - "docker.io/apache/beam_python3.14_sdk"
      - "gcr.io/apache-beam-testing/updated_released_container_images/beam_python3.10_sdk"
      - "gcr.io/apache-beam-testing/updated_released_container_images/beam_python3.11_sdk"
      - "gcr.io/apache-beam-testing/updated_released_container_images/beam_python3.12_sdk"
      - "gcr.io/apache-beam-testing/updated_released_container_images/beam_python3.13_sdk"
      - "gcr.io/apache-beam-testing/updated_released_container_images/beam_python3.14_sdk"
      - "gcr.io/cloud-dataflow/v1beta3/beam_python3.10_sdk"
      - "gcr.io/cloud-dataflow/v1beta3/beam_python3.11_sdk"
      - "gcr.io/cloud-dataflow/v1beta3/beam_python3.12_sdk"
      - "gcr.io/cloud-dataflow/v1beta3/beam_python3.13_sdk"
      - "gcr.io/cloud-dataflow/v1beta3/beam_python3.14_sdk"
      - "us.gcr.io/cloud-dataflow/v1beta3/beam_python3.10_sdk"
      - "us.gcr.io/cloud-dataflow/v1beta3/beam_python3.11_sdk"
      - "us.gcr.io/cloud-dataflow/v1beta3/beam_python3.12_sdk"
      - "us.gcr.io/cloud-dataflow/v1beta3/beam_python3.13_sdk"
      - "us.gcr.io/cloud-dataflow/v1beta3/beam_python3.14_sdk"
    runtime_entrypoints:
      - "/opt/apache/beam/boot"
      - "python -m apache_beam.runners.worker.sdk_worker_main"
    inherited_rule_sets:
      - "debian_build_and_desktop_os_packages"
    statements: []

  beam_java_sdk:
    description: "Apache Beam Java SDK harness container images (Java 8, 11, 17, 21, 25)"
    repositories:
      - "docker.io/apache/beam_java8_sdk"
      - "docker.io/apache/beam_java11_sdk"
      - "docker.io/apache/beam_java17_sdk"
      - "docker.io/apache/beam_java21_sdk"
      - "docker.io/apache/beam_java25_sdk"
      - "gcr.io/apache-beam-testing/updated_released_container_images/beam_java8_sdk"
      - "gcr.io/apache-beam-testing/updated_released_container_images/beam_java11_sdk"
      - "gcr.io/apache-beam-testing/updated_released_container_images/beam_java17_sdk"
      - "gcr.io/apache-beam-testing/updated_released_container_images/beam_java21_sdk"
      - "gcr.io/apache-beam-testing/updated_released_container_images/beam_java25_sdk"
      - "gcr.io/cloud-dataflow/v1beta3/beam_java8_sdk"
      - "gcr.io/cloud-dataflow/v1beta3/beam_java11_sdk"
      - "gcr.io/cloud-dataflow/v1beta3/beam_java17_sdk"
      - "gcr.io/cloud-dataflow/v1beta3/beam_java21_sdk"
      - "gcr.io/cloud-dataflow/v1beta3/beam_java25_sdk"
      - "us.gcr.io/cloud-dataflow/v1beta3/beam_java8_sdk"
      - "us.gcr.io/cloud-dataflow/v1beta3/beam_java11_sdk"
      - "us.gcr.io/cloud-dataflow/v1beta3/beam_java17_sdk"
      - "us.gcr.io/cloud-dataflow/v1beta3/beam_java21_sdk"
      - "us.gcr.io/cloud-dataflow/v1beta3/beam_java25_sdk"
    runtime_entrypoints:
      - "/opt/apache/beam/boot"
      - "org.apache.beam.fn.harness.FnHarness"
    inherited_rule_sets:
      - "debian_build_and_desktop_os_packages"
    statements: []

  beam_multi_lang_and_tools:
    description: "Apache Beam TypeScript, YAML, Prism, and Notebook container images"
    repositories:
      - "docker.io/apache/beam_typescript_sdk"
      - "docker.io/apache/beam_yaml_sdk"
      - "docker.io/apache/beam_prism"
      - "docker.io/apache/beam-jupyterlab-notebook"
      - "gcr.io/apache-beam-testing/updated_released_container_images/beam_typescript_sdk"
      - "gcr.io/apache-beam-testing/updated_released_container_images/beam_yaml_sdk"
      - "gcr.io/apache-beam-testing/updated_released_container_images/beam_prism"
      - "gcr.io/apache-beam-testing/updated_released_container_images/beam-jupyterlab-notebook"
    runtime_entrypoints:
      - "/opt/apache/beam/boot"
    inherited_rule_sets:
      - "debian_build_and_desktop_os_packages"
    statements: []

shared_rule_sets:
  debian_build_and_desktop_os_packages:
    description: >-
      OS compiler toolchains, binary inspection CLI tools, and desktop/multimedia
      libraries present in upstream Debian base layers that are never loaded or
      executed at runtime by the Apache Beam SDK harness.
    statements:
      - ids:
          - "CVE-2022-27943"
          - "CVE-2023-4039"
          - "CVE-2026-95619"
          - "CVE-2026-102010"
          - "CVE-2026-114690"
          - "CVE-2026-114691"
          - "CVE-2026-115456"
        status: "not_affected"
        justification: "vulnerable_code_not_in_execute_path"
        packages: ["gcc-12"]
        impact_statement: >-
          gcc-12 compiler binaries and C++ demangler CLI utilities are inherited
          from the Debian build layer and are not invoked at runtime by the
          Apache Beam SDK worker harness (/opt/apache/beam/boot).
      - ids:
          - "CVE-2018-20673"
          - "CVE-2018-20712"
          - "CVE-2021-32256"
          - "CVE-2023-1972"
          - "CVE-2024-53589"
          - "CVE-2025-0840"
          - "CVE-2025-1178"
          - "CVE-2025-1179"
          - "CVE-2025-5244"
          - "CVE-2025-5245"
          - "CVE-2025-7545"
          - "CVE-2025-7546"
          - "CVE-2025-11082"
          - "CVE-2025-11083"
          - "CVE-2025-66862"
          - "CVE-2025-66863"
          - "CVE-2025-66864"
          - "CVE-2025-66865"
          - "CVE-2025-66866"
          - "CVE-2025-69647"
          - "CVE-2025-69648"
          - "CVE-2025-69649"
          - "CVE-2025-69650"
          - "CVE-2025-69652"
          - "CVE-2026-3441"
          - "CVE-2026-3442"
          - "CVE-2026-4647"
          - "CVE-2026-6846"
          - "CVE-2026-18220"
          - "CVE-2026-90801"
          - "CVE-2026-90803"
          - "CVE-2026-90804"
          - "CVE-2026-90828"
        status: "not_affected"
        justification: "vulnerable_code_not_in_execute_path"
        packages: ["binutils"]
        impact_statement: >-
          GNU binutils CLI utilities (objdump, readelf, nm, ld, strip) and libbfd
          are build-time tools inherited from the base OS image and are never
          invoked on untrusted ELF inputs by the Beam SDK harness at runtime.
      - ids:
          - "CVE-2025-1352"
          - "CVE-2025-1365"
          - "CVE-2025-1372"
        status: "not_affected"
        justification: "vulnerable_code_not_in_execute_path"
        packages: ["elfutils"]
        impact_statement: >-
          elfutils DWARF/ELF inspection utilities (eu-readelf, eu-stack) are not
          executed at runtime by the Apache Beam SDK harness.
      - ids:
          - "CVE-2008-1687"
          - "CVE-2008-1688"
        status: "not_affected"
        justification: "vulnerable_code_not_in_execute_path"
        packages: ["m4"]
        impact_statement: >-
          GNU m4 is a build-time macro processor pulled in by autotools/compiler
          dependencies in the base OS layer and is never invoked at runtime.
      - ids:
          - "CVE-2007-3476"
          - "CVE-2007-3477"
          - "CVE-2009-3546"
          - "CVE-2023-39327"
          - "CVE-2023-51596"
          - "CVE-2024-31047"
          - "CVE-2025-50422"
          - "CVE-2026-19774"
          - "CVE-2026-62289"
          - "CVE-2026-81893"
          - "CVE-2026-84448"
          - "CVE-2026-84449"
          - "CVE-2026-84450"
          - "CVE-2026-85218"
          - "CVE-2026-109282"
        status: "not_affected"
        justification: "vulnerable_code_not_in_execute_path"
        packages:
          - "bluez"
          - "cairo"
          - "gdk-pixbuf"
          - "imagemagick"
          - "libheif"
          - "libwmf"
          - "openexr"
          - "openjpeg2"
        impact_statement: >-
          Bluetooth and desktop image-rendering libraries present in the upstream
          Debian language base image are not loaded or executed by the Apache
          Beam SDK worker harness.
