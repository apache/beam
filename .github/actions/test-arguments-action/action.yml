name: 'Set test arguments action'
description: 'Set test arguments action to run the test'
inputs:
  argument-file-paths:
    required: true
    description: 'List of paths to files with test arguments'
    default: ''
  arguments:
    required: false
    description: 'Test arguments generated at runtime'
    default: ''
  test-type:
    required: true
    description: 'Specify if this is a "load" or "performance" test'
  test-language:
    required: true
    description: 'Specify if this is a "java", "python" or "go" test'

runs:
  using: composite
  steps:
    - name: Check if test-type was provided
      env:
        INPUT_TEST_TYPE: ${{ inputs.test-type }}
      shell: bash
      run: |
        if [ -z "${INPUT_TEST_TYPE}" ]; then
          echo "Test type was not provided"
          exit 1
        fi
    - name: Check if test-language was provided
      env:
        INPUT_TEST_LANGUAGE: ${{ inputs.test-language }}
      shell: bash
      run: |
        if [ -z "${INPUT_TEST_LANGUAGE}" ]; then
          echo "Test language was not provided"
          exit 1
        fi
    - name: Set common arguments
      id: common_arguments
      shell: bash
      run: |
        echo project="apache-beam-testing" >> "$GITHUB_OUTPUT"
        echo influx_db_name="beam_test_metrics" >> "$GITHUB_OUTPUT"
        echo influx_host="http://10.128.0.96:8086" >> "$GITHUB_OUTPUT"
    - name: Get default ${{ inputs.test-language }} test arguments
      id: default_arguments
      env:
        INPUT_TEST_LANGUAGE: ${{ inputs.test-language }}
        COMMON_PROJECT: ${{ steps.common_arguments.outputs.project }}
        COMMON_INFLUX_DB: ${{ steps.common_arguments.outputs.influx_db_name }}
        COMMON_INFLUX_HOST: ${{ steps.common_arguments.outputs.influx_host }}
      shell: bash
      run: |
        DEFAULT_ARGUMENTS=""
        if [[ "${INPUT_TEST_LANGUAGE}" == "java" ]]; then
          DEFAULT_ARGUMENTS="--project=${COMMON_PROJECT} --influxDatabase=${COMMON_INFLUX_DB} --influxHost=${COMMON_INFLUX_HOST}"
        elif [[ "${INPUT_TEST_LANGUAGE}" == "python" || "${INPUT_TEST_LANGUAGE}" == "go" ]]; then
          DEFAULT_ARGUMENTS="--project=${COMMON_PROJECT} --influx_db_name=${COMMON_INFLUX_DB} --influx_hostname=${COMMON_INFLUX_HOST}"
        fi
        echo "arguments=${DEFAULT_ARGUMENTS}" >> "$GITHUB_OUTPUT"
    - name: Group arguments
      env:
        INPUT_ARGUMENT_FILE_PATHS: ${{ inputs.argument-file-paths }}
        DEFAULT_ARGUMENTS: ${{ steps.default_arguments.outputs.arguments }}
        INPUT_ARGUMENTS: ${{ inputs.arguments }}
        INPUT_TEST_TYPE: ${{ inputs.test-type }}
        JOB_ID: ${{ github.job }}
      shell: bash
      run: |
        if [[ ! "${JOB_ID}" =~ ^[A-Za-z0-9_-]+$ ]]; then
          echo "::error::Invalid job identifier: ${JOB_ID}"
          exit 1
        fi
        read -r -a PATHS <<< "$(printf '%s' "${INPUT_ARGUMENT_FILE_PATHS}" | tr '\n' ' ')"
        for index in "${!PATHS[@]}"; do
          CONFIG=$(grep -v "^#.*" "${PATHS[index]}" || true)
          ARGUMENTS=$(printf '%s %s %s' "${DEFAULT_ARGUMENTS}" "${INPUT_ARGUMENTS}" "${CONFIG}" | tr '\n\r' '  ' | tr -s ' ')
          ARGUMENTS="${ARGUMENTS# }"
          ARGUMENTS="${ARGUMENTS% }"
          if [[ "${INPUT_TEST_TYPE}" == "performance" ]]; then
            arguments=""
            read -r -a args <<< "${ARGUMENTS}"
            for arg in "${args[@]}"; do
              arguments="${arguments}\"${arg}\","
            done
            ARGUMENTS="${arguments%,}"
          fi
          {
            printf '%s_test_arguments_%d=%s\n' "${JOB_ID}" "$((index + 1))" "${ARGUMENTS}"
          } >> "$GITHUB_ENV"
        done
