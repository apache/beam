name: 'Setup environment action'
description: 'Setup environment to run jobs'
inputs:
  python-version:
    required: false
    description: 'Install Python version'
    default: ''
  java-version:
    required: false
    description: 'Install Java version'
    default: ''
  go-version:
    required: false
    description: 'Install Go version'
    default: ''
  rust-version:
    required: false
    description: 'Install Rust toolchain version'
    default: ''
  disable-cache:
    required: false
    description: 'Whether to disable the Gradle and Go caches'
    default: false
  python-cache:
    required: false
    description: 'Whether to enable Python pip caching'
    default: true
  tox-cache:
    required: false
    description: 'Whether to enable tox environment caching'
    default: true
  rust-cache:
    required: false
    description: 'Whether to enable Cargo dependency caching'
    default: true

runs:
  using: "composite"
  steps:
    - name: Install Python
      if: ${{ inputs.python-version != '' }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version == 'default' && '3.11' || inputs.python-version }}
        cache: ${{ inputs.python-cache && 'pip' || 'none' }}
        cache-dependency-path: |
          sdks/python/setup.py
          sdks/python/tox.ini

    # Multiline python-version (e.g. 3.10\n3.11\n...) must not be embedded raw
    # in cache keys: actions/cache treats each newline-separated line as a
    # separate key and fails when there are more than 10 ("Keys are limited to
    # a maximum of 10"). Collapse whitespace into a single key fragment.
    - name: Sanitize Python version for tox cache key
      if: ${{ inputs.python-version != '' && inputs.tox-cache == 'true' }}
      id: py-cache-key
      shell: bash
      env:
        PYTHON_VERSION_INPUT: ${{ inputs.python-version }}
      run: |
        if [[ "$PYTHON_VERSION_INPUT" == "default" ]]; then
          sanitized="311"
        else
          sanitized=$(printf '%s' "$PYTHON_VERSION_INPUT" | tr -s '[:space:]' '-' | sed 's/^-//;s/-$//')
        fi
        echo "sanitized=$sanitized" >> "$GITHUB_OUTPUT"

    - name: Cache tox environments
      if: ${{ inputs.python-version != '' && inputs.tox-cache == 'true' }}
      uses: actions/cache@v6
      with:
        path: |
          sdks/python/target/.tox
          !sdks/python/target/.tox/**/log
          !sdks/python/target/.tox/.package_cache
        key: tox-${{ runner.os }}-py${{ steps.py-cache-key.outputs.sanitized }}-${{ hashFiles('sdks/python/tox.ini') }}-${{ hashFiles('sdks/python/setup.py') }}
        restore-keys: |
          tox-${{ runner.os }}-py${{ steps.py-cache-key.outputs.sanitized }}-${{ hashFiles('sdks/python/tox.ini') }}-
          tox-${{ runner.os }}-py${{ steps.py-cache-key.outputs.sanitized }}-

    - name: Install Java
      if: ${{ inputs.java-version != '' }}
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: ${{ inputs.java-version == 'default' && '21' || inputs.java-version }}
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      with:
        cache-disabled: ${{ inputs.disable-cache }}
        validate-wrappers: false
        cache-read-only: ${{ !(github.event_name == 'schedule' || github.event_name == 'push' || github.run_attempt > 1) }}
    - name: Install Go
      if: ${{ inputs.go-version != '' }}
      uses: actions/setup-go@v6
      with:
        go-version: ${{ inputs.go-version == 'default' && '1.26' || inputs.go-version }} # never set patch, to get latest patch releases.
        cache: ${{ inputs.disable-cache != 'true' }}
        cache-dependency-path: sdks/go.sum
    # Both arduino/setup-protoc and Swatinem/rust-cache are on the ASF allowlist:
    # https://github.com/apache/infrastructure-actions/blob/main/approved_patterns.yml
    - name: Install Rust
      if: ${{ inputs.rust-version != '' }}
      shell: bash
      env:
        RUST_VERSION_INPUT: ${{ inputs.rust-version }}
      run: | # zizmor: ignore[github-env] safe: adds rustup cargo bin directory to PATH
        set -euo pipefail
        toolchain="${RUST_VERSION_INPUT}"
        if [[ "${toolchain}" == "default" ]]; then
          toolchain="1.98.1"
        fi
        if [[ ! "${toolchain}" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "Invalid rust-version: ${toolchain}" >&2
          exit 1
        fi
        cargo_bin="${CARGO_HOME:-${HOME}/.cargo}/bin"
        export PATH="${cargo_bin}:${PATH}"
        if command -v rustup > /dev/null 2>&1; then
          rustup toolchain install "${toolchain}" --profile minimal --component rustfmt,clippy
          rustup default "${toolchain}"
        else
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 https://sh.rustup.rs | sh -s -- -y --default-toolchain "${toolchain}" --profile minimal --component rustfmt,clippy --no-modify-path
        fi
        echo "${cargo_bin}" >> "${GITHUB_PATH}"
        rustc --version
        cargo --version
    - name: Install protoc (Rust)
      if: ${{ inputs.rust-version != '' }}
      uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
      with:
        version: '23.x'
        repo-token: ${{ github.token }}
    - name: Cache Cargo dependencies
      if: ${{ inputs.rust-version != '' && inputs.disable-cache != 'true' && inputs.rust-cache == 'true' }}
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: sdks/rust
        save-if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || github.run_attempt > 1 }}
