name: 'Gradle command'
description: 'Configuration actions to run a gradle command in self-hosted runner'
inputs:
  gradle-command:
    required: true
  arguments:
    required: false
    description: 'Gradle options'
    default: ''
  max-workers:
    required: false
    description: 'Max number of workers'
    default: 8

runs:
  using: "composite"
  steps:
    - name: Run Gradle Command
      shell: bash
      run: |
        # This step is a workaround to avoid a decryption issue of Beam's
        # net.linguica.gradle.maven.settings plugin and github's provided maven
        # settings.xml file
        if [ -f ~/.m2/settings.xml ]; then
          rm ~/.m2/settings.xml
        fi
        # If the Gradle distribution is not cached yet (no .ok marker file in wrapper/dists),
        # pre-download and unpack the Gradle wrapper with retries to handle transient HTTP 502/504
        # errors from services.gradle.org / GitHub Releases before running the main Gradle task.
        if ! ls "${GRADLE_USER_HOME:-$HOME/.gradle}"/wrapper/dists/gradle-*/*/*.ok >/dev/null 2>&1; then
          for attempt in 1 2 3; do
            ./gradlew --version --no-daemon && break || sleep 5
          done
        fi
        ./gradlew ${{ inputs.gradle-command }} --max-workers=${{ inputs.max-workers }} --continue --no-daemon \
         -Dorg.gradle.jvmargs=-Xms2g -Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.vfs.watch=false \
        ${{ inputs.arguments }}
