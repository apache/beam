name: Beam Vendor Java Dependency Submission

on:
  schedule:
    - cron: '0 6 * * 1' # Weekly on Mondays at 06:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: true

jobs:
  vendor_dependency_graph:
    name: Vendor Java Dependency Graph
    if: (github.event_name == 'schedule' && github.repository == 'apache/beam') || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, ubuntu-24.04, small]
    timeout-minutes: 30
    permissions:
      contents: write # Required by GitHub's Dependency Submission API (/dependency-graph/snapshots).
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Remove runner Maven settings.xml
        run: |
          # Workaround for net.linguica.maven-settings decryption issue with
          # runner's default ~/.m2/settings.xml.
          rm -f ~/.m2/settings.xml

      - name: Generate and submit vendor Java dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        env:
          GRADLE_OPTS: -Xms2g -Xmx5g
        with:
          cache-disabled: true
          validate-wrappers: false
          dependency-graph: generate-submit-and-upload
          dependency-graph-include-projects: ':vendor:.*'
          dependency-graph-include-configurations: 'runtimeClasspath'
          artifact-retention-days: 5
          additional-arguments: -Dorg.gradle.vfs.watch=false
