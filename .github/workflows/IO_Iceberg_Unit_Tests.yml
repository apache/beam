name: IcebergIO Unit Tests

on:
  push:
    tags: ['v*']
    branches: ['master', 'release-*']
    paths:
      - "sdks/java/io/iceberg/**"
      - "sdks/java/io/managed/**"
      - "sdks/java/expansion-service/**"
      - "sdks/java/io/expansion-service/**"
      - ".github/workflows/IO_Iceberg_Unit_Tests.yml"
  pull_request:
    branches: ['master', 'release-*']
    paths:
      - "sdks/java/io/iceberg/**"
      - "sdks/java/io/managed/**"
      - "sdks/java/expansion-service/**"
      - "sdks/java/io/expansion-service/**"
      - 'release/trigger_all_tests.json'
      - '.github/trigger_files/IO_Iceberg_Unit_Tests.json'
  schedule:
    - cron: '15 1/6 * * *'
  workflow_dispatch:

# Setting explicit permissions for the action
permissions:
  actions: write
  pull-requests: write
  checks: write
  contents: read
  deployments: read
  id-token: none
  issues: write
  discussions: read
  packages: read
  pages: read
  repository-projects: read
  security-events: read
  statuses: read

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.number || github.event.pull_request.head.label || github.sha || github.head_ref || github.ref }}-${{ github.event.schedule || github.event.sender.login }}'
  cancel-in-progress: true

env:
  DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
  GRADLE_ENTERPRISE_CACHE_USERNAME: ${{ secrets.GE_CACHE_USERNAME }}
  GRADLE_ENTERPRISE_CACHE_PASSWORD: ${{ secrets.GE_CACHE_PASSWORD }}

jobs:
  IO_Iceberg_Unit_Tests:
    name: ${{ matrix.job_name }}
    strategy:
      matrix:
        job_name: ["IO_Iceberg_Unit_Tests"]
    timeout-minutes: 60
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'schedule' && github.repository == 'apache/beam') ||
      github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, ubuntu-24.04, main]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup repository
        uses: ./.github/actions/setup-action
      - name: Setup environment
        uses: ./.github/actions/setup-environment-action
      - name: run IcebergIO build script
        uses: ./.github/actions/gradle-command-self-hosted-action
        with:
          gradle-command: :sdks:java:io:iceberg:build
          arguments: |
            -PdisableSpotlessCheck=true \
            -PdisableCheckStyle=true \
            --info
      - name: Archive JUnit Test Results
        uses: actions/upload-artifact@v7
        if: ${{ !success() }}
        with:
          name: JUnit Test Results
          path: "**/build/reports/tests/"
      - name: Publish JUnit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          commit: '${{ env.GITHUB_SHA }}'
          comment_mode: 'off'
          check_run: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          files: '**/build/test-results/**/*.xml'
          large_files: true
      - name: Archive SpotBugs Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: SpotBugs Results
          path: '**/build/reports/spotbugs/*.html'
      - name: Publish SpotBugs Results
        uses: jwgmeligmeyling/spotbugs-github-action@v1.2
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: Publish SpotBugs
          path: '**/build/reports/spotbugs/*.html'
