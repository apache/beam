name: Gemini Enterprise Code Review

on:
  pull_request:
    paths:
      - '.github/workflows/gemini_code_review.yml'
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number to review'
        required: true
        type: number

permissions: read-all

concurrency:
  group: gemini-code-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  gemini-review:
    name: Gemini Enterprise PR Review
    if: github.repository == 'apache/beam'
    runs-on: [self-hosted, ubuntu-24.04, main]
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Run Gemini Enterprise Code Review Agent
        id: gemini_review
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GEMINI_FORCE_FILE_STORAGE: 'true'
          GOOGLE_GENAI_USE_VERTEXAI: 'true'
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID || 'apache-beam-testing' }}
          GOOGLE_CLOUD_LOCATION: 'global'
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-pro-preview' }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          PR_URL="https://github.com/${REPOSITORY}/pull/${PR_NUMBER}"

          mkdir -p .gemini
          cat << 'EOF' > .gemini/settings.json
          {
            "model": {
              "maxSessionTurns": 10
            },
            "experimental": {
              "directWebFetch": true
            },
            "tools": {
              "core": [
                "web_fetch",
                "run_shell_command(gh pr view)",
                "run_shell_command(gh pr diff)"
              ]
            }
          }
          EOF

          cat << EOF > prompt.txt
          You are an autonomous Apache Beam code review agent running on the Gemini Enterprise Agent Platform.
          Review Pull Request: ${PR_URL}

          Respond with ONLY a single valid JSON object matching this exact schema (no markdown prose outside the JSON):
          {
            "summary": "## 📋 Review Summary\n\n2-3 sentence high-level assessment.\n\n## 🔍 General Feedback\n- Key architectural or cross-file observations.",
            "comments": [
              {
                "path": "relative/path/to/file.ext",
                "line": 123,
                "side": "RIGHT",
                "severity": "🟠 High",
                "body": "Clear explanation of why this is an issue and how to fix it.",
                "suggestion": "optional exact replacement line(s) without backticks, or null"
              }
            ]
          }
          EOF

          npx --yes @google/gemini-cli@latest \
            --debug \
            --yolo \
            --model "${GEMINI_MODEL}" \
            --prompt "$(cat prompt.txt)" \
            --output-format json \
            < /dev/null \
            > gemini_raw_output.json

          if jq -e . gemini_raw_output.json >/dev/null 2>&1; then
            jq -r '.response // ""' gemini_raw_output.json > gemini_response.txt
          else
            cp gemini_raw_output.json gemini_response.txt
          fi

      - name: Post PR Review to GitHub
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        with:
          script: |
            const fs = require('fs');
            const prNumber = Number(process.env.PR_NUMBER);
            const rawResponse = fs.existsSync('gemini_response.txt')
              ? fs.readFileSync('gemini_response.txt', 'utf8').trim()
              : '';
            if (!rawResponse) {
              core.warning('Gemini agent returned an empty response; skipping PR review submission.');
              return;
            }

            let parsed;
            const fencedMatch = rawResponse.match(/```(?:json)?\s*([\s\S]*?)```/i);
            const candidateJson = fencedMatch ? fencedMatch[1].trim() : rawResponse;
            try {
              parsed = JSON.parse(candidateJson);
            } catch (firstErr) {
              const firstBrace = rawResponse.indexOf('{');
              const lastBrace = rawResponse.lastIndexOf('}');
              if (firstBrace !== -1 && lastBrace > firstBrace) {
                parsed = JSON.parse(rawResponse.slice(firstBrace, lastBrace + 1));
              } else {
                parsed = { summary: rawResponse, comments: [] };
              }
            }

            const inlineComments = [];
            if (Array.isArray(parsed.comments)) {
              for (const item of parsed.comments) {
                if (!item || !item.path || !item.body || !Number.isInteger(Number(item.line))) {
                  continue;
                }
                const side = item.side === 'LEFT' ? 'LEFT' : 'RIGHT';
                const line = Number(item.line);
                const severityPrefix = item.severity ? `**${item.severity}**: ` : '';
                let commentBody = `${severityPrefix}${item.body.trim()}`;

                if (item.suggestion && String(item.suggestion).trim() !== '' && item.suggestion !== 'null') {
                  commentBody += `\n\n\`\`\`suggestion\n${String(item.suggestion).replace(/\r\n/g, '\n')}\n\`\`\``;
                }

                inlineComments.push({
                  path: item.path,
                  line,
                  side,
                  body: commentBody,
                });
              }
            }

            const reviewBody = parsed.summary
              ? String(parsed.summary).trim()
              : '## 📋 Review Summary\n\nAutomated code review completed.';

            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                event: 'COMMENT',
                body: reviewBody,
                comments: inlineComments,
              });
              core.info(`Posted Gemini review on PR #${prNumber} with ${inlineComments.length} inline comment(s).`);
            } catch (reviewErr) {
              core.warning(`Failed to post inline review comments (${reviewErr.message}); falling back to summary-only review.`);
              const allNotes = inlineComments.map(
                c => `- **\`${c.path}\` (line ${c.line})**: ${c.body}`
              );
              const fallbackBody = [
                reviewBody,
                allNotes.length > 0 ? '## 💬 Inline Findings\n\n' + allNotes.join('\n\n') : '',
              ].filter(Boolean).join('\n\n');

              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                event: 'COMMENT',
                body: fallbackBody,
              });
            }
