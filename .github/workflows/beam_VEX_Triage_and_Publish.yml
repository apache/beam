name: Beam Container VEX Triage and Publish

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Beam release tag to scan and attach VEX to (e.g., 2.77.0)"
        required: false
        default: "2.77.0"
      attach_vex:
        description: "Attach OpenVEX (cosign) and CSAF 2.0 VEX (Artifact Registry)"
        type: boolean
        default: true
      open_pr:
        description: "Open a draft PR if new non-exploitable CVEs are discovered"
        type: boolean
        default: true
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  RELEASE: "${{ github.event.inputs.release || '2.77.0' }}"

jobs:
  triage-and-publish-vex:
    runs-on: [self-hosted, ubuntu-24.04, main]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"

      - name: Install scanner and signing dependencies
        run: |
          python3 -m pip install pyyaml
          go install golang.org/x/vuln/cmd/govulncheck@latest
          if ! command -v cosign >/dev/null 2>&1; then
            curl -sSfL https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 -o /tmp/cosign
            echo "8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b  /tmp/cosign" | sha256sum -c -
            sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign
            rm -f /tmp/cosign
          fi
          if ! command -v trivy >/dev/null 2>&1; then
            curl -sSfL https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz -o /tmp/trivy.tar.gz
            echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  /tmp/trivy.tar.gz" | sha256sum -c -
            sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
            sudo chmod 0755 /usr/local/bin/trivy
            rm -f /tmp/trivy.tar.gz
          fi

      - name: Authenticate on GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          service_account: ${{ secrets.GCP_SA_EMAIL }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Configure Docker credential helper
        run: |
          gcloud auth configure-docker gcr.io --quiet

      - name: Run VEX unit tests
        run: |
          python3 sdks/containers/vex/vex_manager_test.py

      - name: Scan containers in Artifact Registry, Trivy, and govulncheck
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p /tmp/vex-reports
          (cd sdks && go build -o /tmp/beam_go_boot ./go/container)
          for entry in \
            "beam_go_sdk:beam_go_sdk" \
            "beam_python3.11_sdk:beam_python_sdk" \
            "beam_python3.12_sdk:beam_python_sdk" \
            "beam_python3.13_sdk:beam_python_sdk" \
            "beam_java11_sdk:beam_java_sdk" \
            "beam_java17_sdk:beam_java_sdk" \
            "beam_java21_sdk:beam_java_sdk"; do
            image_name="${entry%%:*}"
            family_name="${entry##*:}"
            repo="gcr.io/apache-beam-testing/updated_released_container_images/${image_name}"
            digest=$(gcloud artifacts docker images describe "${repo}:${RELEASE}" --format='value(image_summary.digest)')
            if [ -n "${digest}" ]; then
              govuln_arg=""
              if [ "${family_name}" = "beam_go_sdk" ]; then
                govuln_arg="--govulncheck-binary=/tmp/beam_go_boot"
              fi
              python3 sdks/containers/vex/vex_manager.py scan \
                --family="${family_name}" \
                --ar-image="${repo}@${digest}" \
                --ar-location="us" \
                --trivy-image="${repo}@${digest}" \
                ${govuln_arg} \
                --agentic-triage \
                --update-config \
                --report-json="/tmp/vex-reports/${image_name}.json"
            fi
          done
          python3 sdks/containers/vex/vex_manager.py generate --timestamp=2026-11-10T00:00:00Z

      - name: Attach OpenVEX and Artifact Registry CSAF 2.0 VEX statements
        if: ${{ github.event.inputs.attach_vex != 'false' }}
        run: |
          for entry in \
            "beam_go_sdk:beam_go_sdk" \
            "beam_python3.11_sdk:beam_python_sdk" \
            "beam_python3.12_sdk:beam_python_sdk" \
            "beam_python3.13_sdk:beam_python_sdk" \
            "beam_java11_sdk:beam_java_sdk" \
            "beam_java17_sdk:beam_java_sdk" \
            "beam_java21_sdk:beam_java_sdk"; do
            image_name="${entry%%:*}"
            family_name="${entry##*:}"
            repo="gcr.io/apache-beam-testing/updated_released_container_images/${image_name}"
            digest=$(gcloud artifacts docker images describe "${repo}:${RELEASE}" --format='value(image_summary.digest)')
            if [ -n "${digest}" ]; then
              python3 sdks/containers/vex/vex_manager.py generate \
                --family="${family_name}" \
                --extra-uri="${repo}" \
                --extra-digest="${digest}"
              python3 sdks/containers/vex/vex_manager.py attach \
                --image-uri="${repo}@${digest}" \
                --openvex="sdks/containers/vex/openvex/${family_name}.openvex.json" \
                --csaf="sdks/containers/vex/csaf/${family_name}.vex.json" \
                --project="apache-beam-testing"
            fi
          done

      - name: Open draft PR if VEX statements changed
        if: ${{ github.event.inputs.open_pr != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 sdks/containers/vex/vex_manager.py generate --timestamp=2026-11-10T00:00:00Z
          if [ -n "$(git status --porcelain sdks/containers/vex/)" ]; then
            branch_name="vex-auto-update-$(date +'%Y%m%d-%H%M%S')"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -b "${branch_name}"
            git add sdks/containers/vex/
            git commit -m "[VEX] Automated container VEX statement update"
            git push origin "${branch_name}"
            gh pr create \
              --draft \
              --title "[VEX] Automated container VEX statement update" \
              --body "Automated VEX triage update from Artifact Registry, Trivy, and govulncheck container scans."
          fi
