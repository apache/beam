name: PR Failure Summary

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number to summarize'
        required: true
        type: number

permissions: read-all

concurrency:
  group: pr-failure-summary-${{ github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  summarize-failures:
    name: Summarize PR Check Failures
    if: >-
      github.repository == 'apache/beam' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          contains(github.event.comment.body, '/summarize-failures') &&
          (
            github.event.comment.user.login == github.event.issue.user.login ||
            contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.comment.author_association)
          )
        )
      )
    runs-on: [self-hosted, ubuntu-24.04, main]
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
      actions: read
      statuses: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'master' }}
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Setup Node.js for Gemini CLI
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Cluster failed check logs and post sticky PR summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}
          GOOGLE_GENAI_USE_VERTEXAI: 'true'
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID || 'apache-beam-testing' }}
          GOOGLE_CLOUD_LOCATION: 'global'
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-4-argon' }}
        run: |
          set -euo pipefail
          python3 scripts/ci/pr_failure_summary.py
